<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selected Works</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
    #SelectedWorks {
        margin-left: 5%;
        margin-right: 5%;}
    .project {
        margin-left: 0%;
        margin-right: 0%;}
    .responsive {
        width: auto;
        height: auto;
        max-width: 1200px;  /* 최대 너비를 제한하여 이미지 크기를 조정 */
        max-height: 800px; /* 최대 높이를 제한하여 이미지 크기를 조정 */
        object-fit: contain;       /* 비율 유지하면서 박스에 맞춤 */
        display: block;
        margin: 0 auto; /* 가운데 정렬을 원할 경우 */
        margin-top: 200px; /* 하단 여백 설정 */
        margin-bottom: 20px; /* 하단 여백 설정 */}
    .first-image {
        margin-top: 40px !important;  /* 첫번째 이미지 예외적으로 더 작은 여백 */}
    
    @media only screen and (max-width: 768px) {
    #SelectedWorks {
        margin-left: 2%; /* 모바일에서는 좌우여백 줄이기 */
        margin-right: 2%
    }

    .project {
        margin-left: 0%; /* 모바일에서는 여백 없애기 */
        text-align: center; /* 텍스트 가운데 정렬 */
    }

    .responsive {
        max-width: 100%; /* 모바일 화면에서는 전체 너비 사용 */
        margin-top: 40px;
        margin-bottom: 10px;
    }
     .first-image {
        margin-top: 20px !important;  /* 첫번째 이미지 예외적으로 더 작은 여백 */}
    
}
    </style>
</head>
